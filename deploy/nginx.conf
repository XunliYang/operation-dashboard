# 运营看板 · nginx 入口配置
#
# 路由约定：
#   /            → web（React SPA，try_files 回退到 index.html，保证刷新不 404）
#   /rest/v1/    → api（FastAPI，BFF 统一前缀）
#
# 舆情组件采用设计 §5.2 的「方案 A」：独立 server 块 + 独立端口，
# 复用主站容器网络但不与主站抢路径前缀；SSE 需要关闭 proxy_buffering。

upstream od_web {
    server web:80;
    keepalive 16;
}

upstream od_api {
    server api:8000;
    keepalive 16;
}

upstream od_sentiment {
    server sentiment-monitor:3000;
    keepalive 8;
}

server {
    listen 80;
    server_name _;

    # 基础安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 2m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    # ---- Web（SPA） ----
    location / {
        proxy_pass http://od_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # ---- API ----
    location /rest/v1/ {
        proxy_pass http://od_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # 与 api 的请求超时中间件对齐，nginx 略放宽做外层兜底
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 健康检查直通，便于 LB / 探针使用
    location = /healthz {
        proxy_pass http://od_api/healthz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }
}

# ---- 舆情独立 server 块（方案 A） ----
server {
    listen 8081;
    server_name _;

    location / {
        proxy_pass http://od_sentiment;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # SSE 必需：关闭缓冲与压缩，否则事件流被攒批
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
