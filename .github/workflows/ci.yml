name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: ESLint
        working-directory: web
        run: npm run lint

      - name: TypeScript typecheck
        working-directory: web
        run: npx tsc -b

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Ruff (api)
        working-directory: api
        run: ruff check .

      - name: Ruff (collector)
        working-directory: collector
        run: ruff check .

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Web unit tests
        working-directory: web
        run: npm test

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install api
        working-directory: api
        run: pip install -e '.[dev]'

      - name: API tests
        working-directory: api
        run: pytest tests -v

      - name: Install collector
        working-directory: collector
        run: pip install -e '.[dev]'

      - name: Collector tests
        working-directory: collector
        run: pytest tests -v

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Validate compose file
        run: docker compose -f deploy/docker-compose.yml config --quiet

      - name: Validate nginx config
        run: |
          docker run --rm -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            nginx:1.27-alpine nginx -t

      # 走 compose 的构建路径（而非逐个 docker build），
      # 这样各服务的 context / dockerfile 配置本身也被验证。
      - name: Build all service images
        run: docker compose -f deploy/docker-compose.yml build

      - name: Smoke test api image
        run: |
          docker run -d --name od-api-smoke -p 18000:8000 operation-dashboard-api
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18000/healthz > /tmp/healthz.json; then break; fi
            sleep 1
          done
          cat /tmp/healthz.json
          python3 -c "
          import json
          body = json.load(open('/tmp/healthz.json'))
          assert set(body) == {'code','message','data','request_id'}, body
          assert body['code'] == 0, body
          print('api smoke ok')
          "
          docker rm -f od-api-smoke
