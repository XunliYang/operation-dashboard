# 组织 / 团队映射
#
# 字段说明：
#   key         — 组织唯一键，`tracked_repos.yaml` 的 org 字段引用它
#   display     — 展示名
#   members     — 成员 GitHub login 列表，用于成员维度聚合（manual_yaml 最权威来源）
#   companies   — 公司名别名（GitHub profile 的 company 字段匹配，大小写不敏感，双向子串命中）
#   email_domains — 邮箱域名（小写），用于邮箱域名推断（email_domain 来源，confidence ≈0.6）
#   repos       — 该组织下的仓库全名（可选，便于校验）

orgs:
  openan:
    display: OpenAN
    members: []   # OpenAN 成员从采集数据中识别，不在此静态列举
    companies: []
    email_domains: []
    repos:
      - project-openan/registry-center
      - project-openan/orchestration-center
      - project-openan/a2a-t-sdk-python
      - project-openan/a2a-t-sdk-java
      - project-openan/workflow-engine-sdk-python
      - project-openan/workflow-engine-sdk-java
      - project-openan/openan-portal
      - project-openan/governance
      - project-openan/a2a-t-prompt-templates-spec
      - project-openan/docs
      - project-openan/project-openan.github.io
      - project-openan/openan-demo
      - project-openan/openan-installation
  # platform 键保留给 XunliYang/* 自测/冒烟项
  platform:
    display: 平台组
    members:
      - XunliYang
    companies: []
    email_domains: []
    repos:
      - XunliYang/operation-dashboard
      - XunliYang/sentiment-monitor

# 未匹配到任何组织的仓库归入此组织
default_org: openan
