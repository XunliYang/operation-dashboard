# 运营看板 · 开发/演示编排
#
# 用法：
#   docker compose -f deploy/docker-compose.yml up --build
#
# 端口暴露策略：
#   - nginx 是唯一对外入口（web + api 统一走它）
#   - api / postgres / redis 只在容器网络内可达（expose，不 ports）
#   - sentiment-monitor 只 expose，不经公网发布；如需访问走 nginx 8081 的
#     独立 server 块（方案 A）。Phase 3 的 P0-1 要求舆情不直接暴露公网。

name: operation-dashboard

services:
  web:
    build:
      context: ../web
    container_name: od-web
    expose:
      - '80'
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ../api
    container_name: od-api
    expose:
      - '8000'
    environment:
      OD_ENV: ${OD_ENV:-dev}
      OD_PORT: '8000'
      OD_CORS_ORIGINS: '["http://localhost:8080"]'
      OD_RATE_LIMIT_PER_MINUTE: '300'
      OD_DATABASE_URL: postgresql://${POSTGRES_USER:-od}:${POSTGRES_PASSWORD:-od_dev_password}@postgres:5432/${POSTGRES_DB:-operation_dashboard}
      OD_CONFIG_DIR: /app/config
    volumes:
      - ../config:/app/config:ro
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  collector:
    build:
      context: ../collector
    container_name: od-collector
    environment:
      OD_REDIS_URL: redis://redis:6379/0
      OD_CONFIG_DIR: /app/config
      OD_TIMEZONE: Asia/Shanghai
      OD_DATABASE_URL: postgresql://${POSTGRES_USER:-od}:${POSTGRES_PASSWORD:-od_dev_password}@postgres:5432/${POSTGRES_DB:-operation_dashboard}
      OD_GITHUB_TOKEN: ${OD_GITHUB_TOKEN:-}
    volumes:
      - ../config:/app/config:ro
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: od-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-od}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-od_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-operation_dashboard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - '5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-od} -d ${POSTGRES_DB:-operation_dashboard}']
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: od-redis
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redisdata:/data
    expose:
      - '6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    container_name: od-nginx
    ports:
      - '${OD_HTTP_PORT:-8080}:80'
      - '${OD_SENTIMENT_PORT:-8081}:8081'
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - api
      - sentiment-monitor
    restart: unless-stopped

  # 既有舆情组件：Phase 0 仅接入编排，不改其源码。
  # 只 expose，不 ports —— 不直接对公网暴露（为 Phase 3 的 P0-1 铺路）。
  sentiment-monitor:
    build:
      context: ../sentiment-monitor
      dockerfile: ../deploy/Dockerfile.sentiment-monitor
    container_name: od-sentiment-monitor
    expose:
      - '3000'
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: '3000'
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
